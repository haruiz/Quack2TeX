name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    name: macOS app and DMG
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install packaging tools
        run: brew install create-dmg

      - name: Build app
        run: make mac-app

      - name: Build DMG
        run: make mac-dmg

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quack2Tex-macOS
          path: |
            dist/Quack2Tex.app
            dist/Quack2Tex.dmg

  windows:
    name: Windows executable and installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build executable
        shell: bash
        run: make windows-exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: iscc packaging/windows/installer.iss

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Quack2Tex-Windows
          path: |
            dist/Quack2Tex
            dist/Quack2TexSetup.exe
